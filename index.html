<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Program kalkulator</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background: #445764;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container{
            background: rgb(82, 68, 68);
            padding: 25px;
            width: 300px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(68, 51, 51, 0.1);
        }


        input,select{
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }


        button{
            width: 100%;
            padding: 10px;
            background: rgb(182, 202, 202);
            color: rgb(36, 33, 33);
            border: none;
            cursor: pointer;
        }


        button:hover{
            background: rgb(97, 120, 5);
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Kalkulator Sederhana</h2>
        <input type="number" id="angka1" placeholder="Masukan Angka Pertama">
        <input type="number" id="angka2" placeholder="Masukan Angka Kedua">

        <select id="operator">
            <option value="+">Penjumlahan(+)</option>
            <option value="-">Penguranggan(-)</option>
            <option value="*">Perkalian(*)</option>
            <option value="/">Pembagian(/)</option>
        </select>

        <button onclick="hitung()">Hitung()</button>
        <h3 id="hasil">Hasil : -</h3>
    </div>


    <script>
        function hitung(){
            let angka1= Number(document.getElementById("angka1").value)
            let angka2= Number(document.getElementById("angka2").value)

            let operator = document.getElementById("operator").value;
            let hasil;


            if (operator == "+"){
                hasil = angka1 + angka2;
            } else if (operator == "-"){
                hasil = angka1 - angka2;
            } else if (operator == "*"){
                hasil = angka1 * angka2;
            } else if (operator == "/"){
                if (angka2 == 0){
                    hasil = "tidak bisa dibagi nol"
                }else{
                    hasil = angka1 / angka2;
                }
            }
        
            document.getElementById("hasil").innerHTML = "hasil : "+ hasil;

        }
    </script>
</body>
</html>
